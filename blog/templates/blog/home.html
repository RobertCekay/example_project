{% extends 'blog/base.html' %}


{% block content %}

  <div class="row mb-4 align-items-center">
    <div class="col">
      <h1 class="display-5 fw-bold">Latest Posts</h1>
      <p class="text-muted">The freshest content from Super Blog.</p>
    </div>
    <div class="col-auto">
      <a href="{% url 'post-create' %}" class="btn btn-primary">New Post</a>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-md-2 g-4">
    {% for post in posts %}
      <div class="col">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h2 class="card-title h4">{{ post.title }}</h2>
            <p class="card-text">{{ post.content }}</p>
          </div>
          <div class="card-footer bg-transparent d-flex justify-content-between align-items-center">
            <small class="text-muted">Posted {{ post.created_at }}</small>
            <div class="btn-group btn-group-sm" role="group">
              <a href="{% url 'post-update' post.pk %}" class="btn btn-outline-secondary">Edit</a>
              <a href="{% url 'post-delete' post.pk %}" class="btn btn-outline-danger">Delete</a>
            </div>
          </div>
        </div>
      </div>
    {% empty %}
      <div class="col-12">
        <div class="alert alert-info" role="alert">
          No posts yet. Check back soon!
        </div>
      </div>
    {% endfor %}
  </div>


{% endblock %}
